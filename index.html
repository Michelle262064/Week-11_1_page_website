<!DOCTYPE html>
<html lang="en">
 <head>
      <meta charset="UTF-8">
      <title>Student of the Rings</title>
      <link rel="stylesheet" href="css/main.css">

      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
      <link rel="stylesheet" href="css/main.css">

  </head>
  <body class="home-page">
      <section class="hero">
          <h>What type of Student are you?</h>
          <p>What does your student life say about you?</p>
      </section>

      <div class="flexRow">
          <div class="rowItem">
              <form name="studentForm">
                
                  <div class="Name">
                     <label>Enter your name</label>
                     <input type="text" name="userName">
                  </div>
                  
                  <div class="email">
                     <label>Enter your email</label>
                     <input type="email" name="userEmail">
                  </div>
                  
                  <div class="select">
                     <label>Select your struggle meal</label>
                       <select name="struggleMeal">
                         <option value="none">Select a struggle</option>
                         <option value="beans on toast">Beans on Toast</option>
                         <option value="two minute noodles">Two minute noodles</option>
                         <option value="cold oats">Cold Oats</option>
                         <option value="protein shake">Protein Shake</option>
                         <option value="day old eggs">Day Old Eggs</option>
                       </select>
                  </div>
                  
                  <div class="radioButtons">
                      <label>Select your main goal</label>
                      <input type="radio" name="userGoal" value="Academic Weapon"> Academic Weapon
                      <input type="radio" name="userGoal" value="Average Sandwich"> Average Sandwich
                      <input type="radio" name="userGoal" value="What was this about again?"> What was this about again?
                  </div>

                  <div class="checkboxes">
                      <label>Words that describe you:</label>
                      <input class="about" type="checkbox" value="Loyal"> Loyal
                      <input class="about" type="checkbox" value="Smart"> Smart
                      <input class="about" type="checkbox" value="Mysterious"> Mysterious
                      <input class="about" type="checkbox" value="Sly"> Sly
                  </div>

                  <div class="counters">
                     <label>How old are you?</label>
                     <button type="button" ="countBut" id="counterMin" onclick="decCount()">-</button>
                     <input type="text" value="0" id="inputVal" inputmode="numeric" min="1">
                     <button type="button" class="countBut" id="counterPlus" onclick="incCount()">+</button>
                   </div>

                <button class="buttonS" type="submit">Submit</button>
            </form>
        </div>

        <div class="rowItem">
            <div class="code">
                <li>Name:</li>
                <li>Email:</li>
                <li>Struggle Meal:</li>
                <li>Goal:</li>
                <li>Description:</li>
                <li>Age:</li>
            </div>
        </div>
      <script src="JS/script.js"></script>
  </body>
</html>
